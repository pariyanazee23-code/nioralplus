<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NioralPlus | آژانس مسافرتی</title>

<style>
body {
    margin: 0;
    font-family: sans-serif;
    background: #f5f7fa;
}

/* HEADER */
header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 15px 40px;
    background: #0f2027;
    color: white;
}
nav a {
    color: white;
    margin: 0 10px;
    text-decoration: none;
}

/* HERO */
.hero {
    background: linear-gradient(rgba(0,0,0,0.5),rgba(0,0,0,0.5)),
    url("https://picsum.photos/1200/500");
    background-size: cover;
    color: white;
    text-align: center;
    padding: 80px 20px;
}
.search-box {
    background: white;
    padding: 15px;
    border-radius: 10px;
    display: inline-block;
}
.search-box input, .search-box button {
    padding: 10px;
    margin: 5px;
}

/* SERVICES */
.services {
    display: flex;
    justify-content: center;
    gap: 20px;
    padding: 40px;
}
.card {
    background: white;
    padding: 20px;
    border-radius: 10px;
    width: 120px;
    text-align: center;
    box-shadow: 0 0 10px rgba(0,0,0,0.1);
}

/* TOURS */
.tours {
    padding: 40px;
    text-align: center;
}
.tour-card {
    display: inline-block;
    width: 250px;
    margin: 10px;
    background: white;
    border-radius: 10px;
    overflow: hidden;
}
.tour-card img {
    width: 100%;
}
.tour-card button {
    background: #ff7e5f;
    color: white;
    border: none;
    padding: 10px;
    width: 100%;
}

/* FEATURES */
.features {
    display: flex;
    justify-content: space-around;
    padding: 40px;
    background: #fff;
}

/* FOOTER */
footer {
    background: #0f2027;
    color: white;
    text-align: center;
    padding: 20px;
}
</style>
</head>

<body>

<header>
    <h2>NioralPlus ✈️</h2>
    <nav>
        <a href="#">تور</a>
        <a href="#">پرواز</a>
        <a href="#">قطار</a>
        <a href="#">اتوبوس</a>
        <a href="#">هتل</a>
    </nav>
</header>

<section class="hero">
    <h1>سفر رو حرفه‌ای تجربه کن</h1>
    <p>رزرو بلیط، تور، هتل و ویلا با بهترین قیمت</p>

    <div class="search-box">
        <input type="text" placeholder="مبدا">
        <input type="text" placeholder="مقصد">
        <input type="date">
        <button>جستجو</button>
    </div>
</section>

<section class="services">
    <div class="card">✈️<br>پرواز</div>
    <div class="card">🚆<br>قطار</div>
    <div class="card">🚌<br>اتوبوس</div>
    <div class="card">🏨<br>هتل</div>
    <div class="card">🌴<br>تور</div>
</section>

<section class="tours">
    <h2>تورهای ویژه</h2>

    <div class="tour-card">
        <img src="https://picsum.photos/300/200">
        <h3>استانبول</h3>
        <p>از 10 میلیون</p>
        <button>رزرو</button>
    </div>

    <div class="tour-card">
        <img src="https://picsum.photos/300/201">
        <h3>دبی</h3>
        <p>از 15 میلیون</p>
        <button>رزرو</button>
    </div>

</section>

<section class="features">
    <div>💰 بهترین قیمت</div>
    <div>⚡ رزرو سریع</div>
    <div>🔐 پرداخت امن</div>
    <div>📞 پشتیبانی 24 ساعته</div>
</section>

<footer>
    <p>NioralPlus © 2026</p>
</footer>

</body>
</html>
