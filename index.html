<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NioralPlus</title>

<style>
body {font-family:sans-serif;margin:0;background:#f4f6f9}

/* HERO */
.hero{
background:url("https://picsum.photos/1400/500") center/cover;
padding:100px 20px;
text-align:center;
color:white;
}

.search-box{
background:white;
padding:20px;
border-radius:10px;
display:inline-block;
}

input,button{
padding:10px;margin:5px;border-radius:8px;border:1px solid #ccc;
}

button{
background:#ff7e5f;color:white;border:none;cursor:pointer;
}

/* RESULTS */
.results{
padding:40px;
display:flex;
flex-wrap:wrap;
gap:20px;
justify-content:center;
}

.card{
background:white;
padding:20px;
border-radius:10px;
width:250px;
box-shadow:0 5px 20px rgba(0,0,0,0.1);
}

</style>
</head>

<body>

<section class="hero">
<h1>NioralPlus ✈️</h1>

<div class="search-box">
<input id="from" placeholder="مبدا">
<input id="to" placeholder="مقصد">
<button onclick="search()">جستجو</button>
</div>
</section>

<section class="results" id="results"></section>

<script>

// دیتابیس فیک
const tours = [
{from:"تهران",to:"استانبول",price:"10 میلیون"},
{from:"تهران",to:"دبی",price:"15 میلیون"},
{from:"مشهد",to:"کیش",price:"5 میلیون"}
];

function search(){
let from = document.getElementById("from").value;
let to = document.getElementById("to").value;

let resultBox = document.getElementById("results");
resultBox.innerHTML = "";

let filtered = tours.filter(t =>
t.from.includes(from) && t.to.includes(to)
);

if(filtered.length === 0){
resultBox.innerHTML = "<p>موردی پیدا نشد 😢</p>";
return;
}

filtered.forEach(t=>{
resultBox.innerHTML += `
<div class="card">
<h3>${t.to}</h3>
<p>از ${t.from}</p>
<p>${t.price}</p>
<button onclick="alert('رزرو انجام شد 😄')">رزرو</button>
</div>
`;
});
}

</script>

</body>
</html>
